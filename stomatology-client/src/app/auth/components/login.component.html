<div class="login-container">
  <div class="form-header">
    <h3>Вход</h3>
  </div>
  <div class="form-body">
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <!-- поля формы -->
      <div class="form-group">
        <label>Email</label>
        <input type="email" formControlName="email" class="form-control">
        <div class="invalid-feedback" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
          Введите корректный email
        </div>
      </div>
      <div class="form-group">
        <label>Пароль</label>
        <input type="password" formControlName="password" class="form-control">
        <div class="invalid-feedback" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          Пароль обязателен
        </div>
      </div>
      <div class="alert" *ngIf="errorMessage">{{ errorMessage }}</div>
      <button type="submit" class="btn" [disabled]="loginForm.invalid || loading">
        {{ loading ? 'Вход...' : 'Войти' }}
      </button>
    </form>
  </div>
</div>
