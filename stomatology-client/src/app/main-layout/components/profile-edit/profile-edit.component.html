<div class="profile-edit">
    <div class="form-header">
        <h3>Редактирование профиля</h3>
    </div>
    <div class="form-body">
        <div class="avatar-static">
            <div class="avatar-circle">{{ (user.first_name.charAt(0) || '?') }}</div>
        </div>
        <form [formGroup]="profileForm" (ngSubmit)="onSubmit()">
            <div class="form-group"><label>Имя</label><input type="text" formControlName="first_name"></div>
            <div class="form-group"><label>Фамилия</label><input type="text" formControlName="last_name"></div>
            <div class="form-error" *ngIf="errorMessage">{{ errorMessage }}</div>
            <div class="form-actions">
                <button type="button" class="btn-secondary" (click)="onCancel()">Отмена</button>
                <button type="submit" class="btn-primary" [disabled]="profileForm.invalid || loading">{{ loading ?
                    'Сохранение...' : 'Сохранить' }}</button>
            </div>
        </form>
    </div>
</div>
