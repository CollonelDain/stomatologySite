<div class="patient-form">
    <div class="form-header">
        <h3>{{ isEdit ? 'Редактировать пациента' : 'Новый пациент' }}</h3>
    </div>
    <div class="form-body">
        <form [formGroup]="patientForm" (ngSubmit)="onSubmit()">
            <div class="form-row">
                <div class="form-group">
                    <label>Код пациента *</label>
                    <input type="text" formControlName="patient_code">
                    <div class="field-error"
                        *ngIf="patientForm.get('patient_code')?.invalid && patientForm.get('patient_code')?.touched">
                        Обязательное поле</div>
                </div>
            </div>
            <div class="form-row two-columns">
                <div class="form-group"><label>Имя *</label><input type="text" formControlName="first_name"></div>
                <div class="form-group"><label>Фамилия *</label><input type="text" formControlName="last_name"></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>Отчество</label><input type="text" formControlName="middle_name"></div>
            </div>
            <div class="form-row two-columns">
                <div class="form-group"><label>Email</label><input type="email" formControlName="email">
                    <div class="field-error"
                        *ngIf="patientForm.get('email')?.invalid && patientForm.get('email')?.touched">Неверный email
                    </div>
                </div>
                <div class="form-group"><label>Телефон</label><input type="tel" formControlName="phone"></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>Дата рождения</label><input type="date" max="9999-12-31"
                        formControlName="date_of_birth"></div>
            </div>
            <div class="form-error" *ngIf="errorMessage">{{ errorMessage }}</div>
            <div class="form-actions">
                <button type="button" class="btn-secondary" (click)="onCancel()">Отмена</button>
                <button type="submit" class="btn-primary" [disabled]="patientForm.invalid || loading">{{ loading ?
                    'Сохранение...' : 'Сохранить' }}</button>
            </div>
        </form>
    </div>
</div>
