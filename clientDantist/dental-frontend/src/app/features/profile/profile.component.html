<div class="profile-container">
  <div class="header">
    <h1>Профиль врача</h1>
    <button (click)="logout()" class="logout-btn">Выйти</button>
  </div>

  <div class="profile-info">
    <div>
      <strong>Имя:</strong> {{ user?.full_name || (user?.first_name + ' ' + user?.last_name) || user?.username }}
    </div>
    <div>
      <strong>Email:</strong> {{ user?.email }}
    </div>
    <div>
      <strong>Логин:</strong> {{ user?.username }}
    </div>
    <button (click)="editMode = !editMode">Редактировать профиль</button>
  </div>

  <div *ngIf="editMode" class="modal">
    <h3>Редактирование профиля</h3>
    <form [formGroup]="profileForm" (ngSubmit)="updateProfile()">
      <div>
        <label>Имя:</label>
        <input type="text" formControlName="first_name" />
      </div>
      <div>
        <label>Фамилия:</label>
        <input type="text" formControlName="last_name" />
      </div>
      <div>
        <label>Аватар (URL):</label>
        <input type="text" formControlName="avatar" />
      </div>
      <div class="actions">
        <button type="submit">Сохранить</button>
        <button type="button" (click)="editMode = false">Отмена</button>
      </div>
    </form>
  </div>

  <hr />

  <h2>Пациенты</h2>
  <app-patient-form (patientAdded)="loadPatients()"></app-patient-form>

  <div class="search">
    <input
      type="text"
      placeholder="Поиск по имени, фамилии, email"
      [(ngModel)]="searchQuery"
      (ngModelChange)="onSearch()"
    />
  </div>

  <app-patient-list
    [patients]="patients"
    [loading]="loading"
    (refresh)="loadPatients()"
  ></app-patient-list>
</div>
